<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; margin: 0; }
    h2 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 12px; font-size: 12px; color: #888; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; }
    .status { padding: 10px; border-radius: 8px; font-size: 12px; margin: 8px 0; }
    .status.connected { background: rgba(16,185,129,0.15); color: #10b981; }
    .status.disconnected { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .platform { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; margin: 4px 0; background: #2a2a4a; }
    .platform .icon { font-size: 18px; }
    .platform .name { flex: 1; font-size: 13px; }
    .platform .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .badge.on { background: rgba(16,185,129,0.2); color: #10b981; }
    .badge.off { background: rgba(255,255,255,0.1); color: #888; }
    input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #3a3a5a; background: #2a2a4a; color: #e0e0e0; font-size: 12px; box-sizing: border-box; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>🚀 LeadFlow AI</h2>
  <p>Social Lead Outreach</p>

  <div id="loginSection">
    <p>Log in with your LeadFlow account</p>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" type="password" />
    <button class="btn btn-primary" onclick="login()">Login</button>
  </div>

  <div id="mainSection" style="display:none">
    <div class="status" id="statusMsg">Connecting...</div>

    <p style="margin-top:12px"><strong>Connected Platforms</strong></p>
    <div id="platforms"></div>

    <button class="btn btn-primary" onclick="connectCurrent()" style="margin-top:12px">
      🔗 Connect Current Site
    </button>
    <button class="btn btn-secondary" onclick="openDashboard()">
      📊 Open Dashboard
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
